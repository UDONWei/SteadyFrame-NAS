name: Verify application and Docker
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libglib2.0-0
      - run: python -m pip install -r requirements.txt pytest==8.3.5 httpx==0.28.1
      - run: python -m pytest -q
      - run: node --check app/web/app.js && node tests/test_idle_ui.js
      - run: VIDEO_DIR=/tmp docker compose config --quiet
      - run: docker build -t steadyframe-nas:test .
      - name: Check container health
        run: |
          mkdir -p /tmp/steadyframe-media /tmp/steadyframe-data
          chmod 777 /tmp/steadyframe-data
          docker run -d --name steadyframe-test --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --memory 6g --cpus 2 -p 127.0.0.1:8786:8786 -v /tmp/steadyframe-media:/media:ro -v /tmp/steadyframe-data:/data steadyframe-nas:test
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8786/api/health; then exit 0; fi
            sleep 2
          done
          docker logs steadyframe-test
          exit 1
