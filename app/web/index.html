<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SteadyFrame NAS</title>
<link rel="stylesheet" href="style.css"><body><header><b>SteadyFrame <span>NAS</span></b><small>视频防抖工作台 · 本地 CPU 处理</small></header>
<main><aside><h2>01 / 选择视频</h2><button id="up">返回上一级</button><p id="folder">/</p><div id="files"></div></aside>
<section><h2>02 / 预览与主体</h2><p id="hint">从左侧选择视频，准备预览后可点选主体或拖动选框。原视频保持只读。</p><canvas id="canvas" width="960" height="540"></canvas><video id="preview" controls hidden></video><p id="selection">未选择主体</p>
<h2>03 / 防抖与导出</h2><form id="render"><div class="grid"><label>防抖方式<select id="mode"><option value="smooth">平滑运镜 · 平移 + 旋转</option><option value="translation">基础防抖 · 仅平移</option><option value="lock">固定机位 · 锁定首帧</option><option value="subject">主体跟踪 · 锁定所选主体</option></select></label>
<label>平滑半径（帧）<input id="smoothing" type="number" value="30" min="1" max="150"></label><label>裁切放大倍率<input id="zoom" type="number" value="1.1" min="1" max="2" step="0.05"></label>
<label>分辨率（高度，保持比例）<select id="resolution"><option value="0">原分辨率</option><option>480</option><option>720</option><option>1080</option><option>1440</option><option>2160</option></select></label>
<label>容器<select id="format"><option value="mp4">MP4</option><option value="mov">MOV</option><option value="mkv">MKV</option><option value="webm">WebM</option></select></label>
<label>编码<select id="codec"><option value="h264">H.264（兼容优先）</option><option value="hevc">HEVC / H.265</option><option value="vp9">VP9（WebM）</option></select></label></div><p>放大可减少边缘黑边，强烈运动仍可能露黑。固定机位和主体锁定不使用平滑半径。输出为 8-bit SDR，HDR 素材暂不建议使用。</p><button id="submit" disabled>开始防抖并导出</button></form><p id="error" role="alert"></p>
<h2>任务记录</h2><div id="jobs"></div></section></main><script src="app.js"></script></body></html>
